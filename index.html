<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#20182d">
<title>PATROL</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;800&family=Press+Start+2P&family=Space+Mono:wght@400&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#20182d}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#world{pointer-events:none}

<canvas id="world" aria-hidden="true"></canvas>
<canvas id="glass" aria-label="PATROL，按回车出击，按 C 切换视角"></canvas>
<script>
'use strict';

// Palette: late sunlight bleaches peach into ivory, while wet rock falls into violet.
const colors = {
  ink:'#20182d', black:'#302039', plum:'#49304e', violet:'#654263',
  mauve:'#966079', haze:'#bc7e88', peach:'#edaa93', copper:'#b76b56',
  ochre:'#dd975b', gold:'#f8c685', cream:'#fff0c7', hot:'#fffbe6',
  slate:'#504b69', indigo:'#373857', red:'#ff927a'
};
const bayer = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const world = document.querySelector('#world');
const glass = document.querySelector('#glass');
const ctx = glass.getContext('2d');
const gl = world.getContext('webgl2', {antialias:false, alpha:false, depth:true});
const touch = matchMedia('(pointer:coarse)').matches || /Android|iPhone|iPad/.test(navigator.userAgent);
const clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));
const mix = (a,b,t) => a+(b-a)*t;
const smooth = t => t*t*(3-2*t);
const approach = (a,b,rate,dt) => mix(a,b,1-Math.exp(-rate*dt));
const rad = Math.PI/180;
const tile = 4096, fieldSize = 1024, cpuSize = 256;
const wrap = (value,size) => ((value%size)+size)%size;

// Terrain worker. Each stripe evaluates the same periodic, seeded field.
function terrainWorker() {
  function hash(x,z) {
    let n = Math.imul(x+71,374761393) ^ Math.imul(z+113,668265263);
    n = Math.imul(n ^ (n>>>13),1274126177);
    return ((n ^ (n>>>16))>>>0)/4294967295;
  }
  function noise(u,v,period) {
    const x = Math.floor(u*period), z = Math.floor(v*period);
    let a = u*period-x, b = v*period-z;
    a *= a*(3-2*a); b *= b*(3-2*b);
    const at = (i,j) => hash((i%period+period)%period,(j%period+period)%period);
    const lo = at(x,z)+(at(x+1,z)-at(x,z))*a;
    const hi = at(x,z+1)+(at(x+1,z+1)-at(x,z+1))*a;
    return lo+(hi-lo)*b;
  }
  self.onmessage = ({data:{start,end,size}}) => {
    const values = new Float32Array((end-start)*size);
    const tau = 2*Math.PI;
    for (let z=start;z<end;z++) {
      const v = (z+.5)/size;
      const bend = .13*Math.sin(tau*(v-.08))+.055*Math.sin(2*tau*v+1.3);
      for (let x=0;x<size;x++) {
        const u = (x+.5)/size;
        const crest = noise(u+.11,v,5)*.62+noise(u,v+.31,11)*.26+noise(u,v,26)*.12;
        const shore = Math.abs(Math.sin(Math.PI*(u-.53-bend)));
        const land = (shore-.31)*260+(noise(u,v,7)-.52)*64;
        const hills = Math.max(0,land+14)*(.33+crest*crest*2.45);
        const islands = Math.max(0,noise(u+.27,v+.12,9)-.72)*150;
        values[(z-start)*size+x] = land<0 ? land+islands : hills + (noise(u,v,61)-.62)*8-10;
      }
      if ((z-start+1)%32===0) self.postMessage({rows:z-start+1});
    }
    self.postMessage({start,values},[values.buffer]);
  };
}
const terrain = new Float32Array(fieldSize*fieldSize);
const cpuTerrain = new Float32Array(cpuSize*cpuSize);
let progress = 0, loading = '正在生成湖区地形…', ready = false, failure = '', terrainReady = false;
let renderWorld, renderJet;
function buildTerrain() {
  const count = Math.min(4,Math.max(2,navigator.hardwareConcurrency||2));
  const source = URL.createObjectURL(new Blob(['('+terrainWorker.toString()+')()'],{type:'text/javascript'}));
  const workers = [];
  const rows = new Array(count).fill(0);
  let completed = 0;
  return new Promise((resolve,reject) => {
    function closeWorkers() {
      for (const worker of workers) worker.terminate();
      URL.revokeObjectURL(source);
    }
    for (let index=0;index<count;index++) {
      const start = Math.floor(index*fieldSize/count), end = Math.floor((index+1)*fieldSize/count);
      const worker = new Worker(source);
      workers.push(worker);
      worker.onerror = event => {closeWorkers(); reject(new Error(event.message));};
      worker.onmessage = ({data}) => {
        if (data.values) {
          terrain.set(data.values,data.start*fieldSize);
          rows[index] = end-start;
          if (++completed===count) {closeWorkers(); resolve();}
        } else rows[index] = data.rows;
        progress = .76*rows.reduce((total,row) => total+row,0)/fieldSize;
      };
      worker.postMessage({start,end,size:fieldSize});
    }
  });
}
function heightAt(x,z) {
  const scale = cpuSize/tile;
  const column = x*scale-.5, row = z*scale-.5;
  const i = Math.floor(column), j = Math.floor(row);
  const at = (xIndex,zIndex) => cpuTerrain[wrap(zIndex,cpuSize)*cpuSize+wrap(xIndex,cpuSize)];
  const a = mix(at(i,j),at(i+1,j),column-i);
  const b = mix(at(i,j+1),at(i+1,j+1),column-i);
  return mix(a,b,row-j);
}
function solidHeight(x,z) {
  const scale = fieldSize/tile;
  return terrain[wrap(Math.floor(z*scale),fieldSize)*fieldSize+wrap(Math.floor(x*scale),fieldSize)];
}

// WebGL setup and shared ordered-color shader functions.
const colorGL = name => 'vec3('+colors[name].slice(1).match(/../g).map(v=>(parseInt(v,16)/255).toFixed(5)).join(',')+')';
const shaderColors = Object.keys(colors).map(name=>'const vec3 '+name+'='+colorGL(name)+';').join('\n');
const shaderCommon = `#version 300 es
precision highp float;
precision highp int;
${shaderColors}
const vec3 sun=vec3(-0.416,0.115,0.902);
const float farClip=3900.;
float threshold() {
  const int matrix[16]=int[16](0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5);
  ivec2 p=ivec2(gl_FragCoord.xy)&3;
  return (float(matrix[p.y*4+p.x])+.5)/16.;
}
vec3 pairColor(vec3 a,vec3 b,float t) {return (t-.32)*2.78>threshold()?b:a;}
vec3 ramp(vec3 a,vec3 b,vec3 c,vec3 d,float amount) {
  float t=clamp(amount,0.,1.)*3.;
  return t<1.?pairColor(a,b,t):t<2.?pairColor(b,c,t-1.):pairColor(c,d,t-2.);
}
float hash(vec2 p) {
  vec3 p3=fract(vec3(p.xyx)*.1031);
  p3+=dot(p3,p3.yzx+33.33);
  return fract((p3.x+p3.y)*p3.z);
}
float noise(vec2 p) {
  vec2 i=floor(p), f=fract(p);
  f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);
}
float depthFor(float z) {return clamp(z/farClip,0.,.99999);}
`;
const screenVertex = `#version 300 es
void main(){
  vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));
  gl_Position=vec4(p*2.-1.,0.,1.);
}`;
const landscapeFragment = shaderCommon + `
out vec4 pixel;
uniform sampler2D field;
uniform vec2 resolution;
uniform vec3 eye, right, up, forward, shadowCenter;
uniform float lens, time, shadowHeight;
uniform int steps;
uniform bool loaded, reflections, titleView;
float heightAt(vec2 p) {return texture(field,fract(p/4096.)).r;}
float relief(vec2 p) {return max(0.,heightAt(p));}
vec3 hazeColor(vec3 ray) {
  float sunward=clamp(dot(normalize(vec2(ray.x,ray.z)+vec2(.0001)),normalize(sun.xz))*.5+.5,0.,1.);
  return ramp(mauve,haze,peach,gold,sunward*.89);
}
vec3 sky(vec3 ray,vec3 origin) {
  float heading=max(0.,dot(ray,sun));
  float rise=max(0.,ray.y);
  vec3 color=ramp(hazeColor(ray),haze,mauve,violet,pow(rise,.53)*1.52);
  float ring=1.-heading;
  if(ring<.041) color=pairColor(color,peach,clamp((.041-ring)*19.,0.,.85));
  if(ring<.012) color=pairColor(color,gold,clamp((.012-ring)*76.,0.,.93));
  if(ray.y>.018) {
    vec2 cloud=(origin.xz+ray.xz*((410.-min(380.,origin.y))/ray.y))*vec2(.00173,.00310);
    cloud+=vec2(time*.009,-time*.004);
    float layer=noise(cloud)*.62+noise(cloud*2.08)*.25+noise(cloud*4.11)*.13;
    float edge=.59+threshold()*.018;
    if(layer>edge && ray.y>.03) {
      float lit=clamp((layer-.57)*2.2+heading*.50+noise(cloud+vec2(.1,-.14))*.15,0.,1.);
      color=ramp(violet,haze,peach,gold,lit);
      if(ray.y<.11) color=pairColor(color,hazeColor(ray),clamp(.55-ray.y*4.,0.,1.));
    }
  }
  if(ring<.0018) color=pairColor(color,cream,(.0018-ring)*530.);
  if(ring<.00066) color=hot;
  return color;
}
float march(vec3 origin,vec3 ray,float limit,int budget,bool reflection) {
  float distance=reflection?13.:1.5, previous=0.;
  for(int index=0;index<96;index++) {
    if(index>=budget || distance>=limit) break;
    vec3 p=origin+ray*distance;
    float ground=heightAt(p.xz);
    float gap=p.y-ground;
    if(gap<=0. && ground>=0.) {
      for(int refine=0;refine<2;refine++) {
        float halfWay=(distance+previous)*.5;
        vec3 q=origin+ray*halfWay;
        float h=heightAt(q.xz);
        if(h>=0. && q.y<=h) distance=halfWay; else previous=halfWay;
      }
      return distance;
    }
    previous=distance;
    distance+=clamp(gap*.46,4.+distance*.019,74.+distance*.018);
  }
  return -1.;
}
vec3 fog(vec3 color,vec3 ray,float distance,float altitude) {
  float amount=1.-exp(-distance*.00079*exp(-max(altitude,0.)*.0039));
  vec3 distanceColor=pairColor(mauve,haze,max(0.,dot(ray,sun)));
  if(amount>.68) return pairColor(distanceColor,hazeColor(ray),(amount-.68)*3.125);
  return pairColor(color,distanceColor,amount/.68);
}
vec3 landColor(vec3 p,vec3 ray,float distance,bool reflected) {
  vec2 stepSize=vec2(8.,0.);
  vec3 normal=normalize(vec3(relief(p.xz-stepSize.xy)-relief(p.xz+stepSize.xy),16.,
    relief(p.xz-stepSize.yx)-relief(p.xz+stepSize.yx)));
  float light=dot(normal,sun);
  float shade=0.;
  if(!reflected) {
    for(int i=1;i<=3;i++) {
      float hop=float(i*i)*12.;
      float blocker=heightAt(p.xz+sun.xz*hop)-p.y-sun.y*hop;
      shade=max(shade,clamp(blocker*.055,0.,1.));
    }
  }
  float grove=noise(p.xz*.035)*.62+noise(p.xz*.12)*.38;
  float exposure=clamp(.40+light*.89-shade*.27+(grove-.5)*.26,0.,1.);
  vec3 color;
  if(p.y<3.) color=ramp(indigo,plum,copper,ochre,exposure);
  else if(exposure<.43) color=ramp(ink,plum,slate,violet,exposure/.43);
  else if(grove<.45) color=ramp(violet,copper,ochre,gold,(exposure-.35)*1.38);
  else color=ramp(violet,mauve,copper,ochre,(exposure-.37)*1.48);
  return fog(color,ray,distance,p.y);
}
void main(){
  vec2 uv=(2.*gl_FragCoord.xy-resolution)/resolution.y;
  vec3 ray=normalize(forward+(right*uv.x+up*uv.y)*lens);
  float water=ray.y<-.0001?-eye.y/ray.y:farClip;
  float distance=loaded?march(eye,ray,min(water+5.,farClip),steps,false):-1.;
  vec3 color;
  if(distance>0. && distance<=water+4.) {
    color=landColor(eye+ray*distance,ray,distance,false);
  } else if(water>0. && water<farClip) {
    distance=water;
    vec3 p=eye+ray*water;
    vec2 rippleCell=floor(p.xz*vec2(.34,.78));
    float wave=noise(rippleCell*vec2(.31,.13)+vec2(time*1.6,-time*2.1))-.5;
    float swell=noise(p.xz*vec2(.021,.079)+vec2(-time*.7,time*.82))-.5;
    vec3 mirror=normalize(vec3(ray.x+wave*.012,-ray.y+swell*.018,ray.z+wave*.006));
    vec3 reflected=sky(mirror,p);
    if(loaded && reflections && water<1450.) {
      float bounce=march(p+vec3(0,2.5,0),mirror,1250.,22,true);
      if(bounce>0.) reflected=pairColor(reflected,landColor(p+vec3(0,2.5,0)+mirror*bounce,mirror,bounce,true),
        (1.-bounce/1250.)*(1.-water/1850.)*.94);
    }
    float spec=max(0.,dot(mirror,sun));
    vec3 base=ramp(indigo,slate,violet,copper,clamp(.22+swell*.31+pow(spec,9.)*.66,0.,1.));
    vec3 tinted=reflected==hot||reflected==cream?gold:
      reflected==gold||reflected==peach?copper:reflected==haze?mauve:reflected;
    color=pairColor(base,tinted,clamp(.60+ray.y*.75+swell*.39,0.,.86));
    float glint=pow(spec,105.)*(wave+.5)*1.7;
    if(glint>threshold()) color=glint>.73?cream:gold;
    color=fog(color,ray,water*.65,6.);
  } else {
    distance=farClip;
    color=sky(ray,eye);
  }
  if(shadowHeight>=0. && shadowHeight<80. && distance<farClip) {
    vec3 p=eye+ray*distance;
    vec2 offset=p.xz-shadowCenter.xz;
    if(p.y<1.) offset.x+=noise(floor(p.xz*.8)+time*3.)*1.6-.8;
    float spread=1.+shadowHeight*.024;
    float ellipse=length(vec2(offset.x/8.,offset.y/13.))/spread;
    float coverage=(1.-shadowHeight/80.)*clamp((1.1-ellipse)*2.,0.,.72);
    if(abs(p.y-shadowCenter.y)<13. && threshold()<coverage) color=p.y<1.?indigo:plum;
  }
  gl_FragDepth=depthFor(distance*dot(forward,ray));
  if(titleView) {
    if(color==hot) color=cream;
    else if(color==cream) color=gold;
    else if(color==gold) color=peach;
    else if(color==peach) color=haze;
    else if(color==haze) color=mauve;
    else if(color==mauve) color=violet;
    else if(color==copper||color==ochre) color=plum;
  }
  pixel=vec4(color,1.);
}`;

function program(vertex,fragment,names) {
  const id=gl.createProgram(), shaders=[];
  for(const [kind,source] of [[gl.VERTEX_SHADER,vertex],[gl.FRAGMENT_SHADER,fragment]]) {
    const shader=gl.createShader(kind);
    gl.shaderSource(shader,source);
    gl.compileShader(shader);
    gl.attachShader(id,shader);
    shaders.push(shader);
  }
  gl.linkProgram(id);
  if(!gl.getProgramParameter(id,gl.LINK_STATUS)) {
    const diagnostics=shaders.map(shader=>gl.getShaderInfoLog(shader)).join('\n');
    throw new Error(diagnostics+gl.getProgramInfoLog(id));
  }
  for(const shader of shaders) gl.deleteShader(shader);
  return {id,uniform:Object.fromEntries(names.split(' ').map(name=>[name,gl.getUniformLocation(id,name)]))};
}

// Low-poly toy. A single interleaved buffer holds the airframe and exhaust triangles.
const jetVertex = `#version 300 es
precision highp float;
layout(location=0) in vec3 vertex;
layout(location=1) in vec3 normal;
layout(location=2) in vec2 material;
uniform vec3 jetPosition,eye;
uniform mat3 attitude,view;
uniform vec2 resolution,control;
uniform float lens,thrust;
out vec3 worldNormal;
out float viewDepth;
flat out float paint,part;
void main(){
  vec3 p=vertex, n=normal;
  paint=material.x; part=material.y;
  if(part==1. || part==2.) {
    float angle=control.x*.32+control.y*.42*(part==1.?-1.:1.);
    mat2 hinge=mat2(cos(angle),sin(angle),-sin(angle),cos(angle));
    p.yz=hinge*vec2(p.y,p.z+1.28)-vec2(0,1.28);
    n.yz=hinge*n.yz;
  }
  if(part==3.) p.z=-2.72+(p.z+2.72)*(.13+thrust*1.36);
  vec3 camera=transpose(view)*(jetPosition+attitude*p-eye);
  worldNormal=attitude*n;
  viewDepth=camera.z;
  gl_Position=vec4(camera.x*resolution.y/resolution.x/lens,camera.y/lens,camera.z-.10,camera.z);
}`;
const jetFragment=shaderCommon+`
in vec3 worldNormal;
in float viewDepth;
flat in float paint,part;
uniform vec3 forward;
uniform float thrust,flicker,visibility;
out vec4 pixel;
void main(){
  if(visibility<threshold()) discard;
  vec3 color;
  if(part==3.) {
    if(thrust<.34 || threshold()>(paint>6.? .77:.39)+flicker*.17) discard;
    color=paint>6.?(thrust>.86?cream:gold):(flicker>0.?peach:copper);
  } else {
    vec3 n=normalize(worldNormal);
    float light=clamp(dot(n,sun)*.78+.5,0.,1.);
    if(paint==1.) color=ramp(plum,copper,ochre,gold,light);
    else if(paint==2.) color=ramp(plum,slate,mauve,cream,light);
    else if(paint==3.) color=ramp(ink,indigo,slate,haze,light);
    else if(paint==4.) color=ramp(ink,plum,slate,violet,light);
    else if(paint==5.) color=ramp(plum,hot,cream,gold,light);
    else color=ramp(slate,mauve,peach,cream,light);
    if(paint!=4. && dot(n,normalize(sun-forward))>.79) color=paint==3.?peach:hot;
  }
  gl_FragDepth=depthFor(viewDepth);
  pixel=vec4(color,1.);
}`;
const add = (a,b) => a.map((v,i)=>v+b[i]);
const sub = (a,b) => a.map((v,i)=>v-b[i]);
const mul = (a,k) => a.map(v=>v*k);
const dot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross = (a,b) => [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const length = a => Math.hypot(...a);
const unit = a => mul(a,1/(length(a)||1));
const blend = (a,b,t) => a.map((v,i)=>mix(v,b[i],t));
function jetGeometry() {
  const data=[];
  function tri(a,b,c,paint=0,part=0) {
    const normal=unit(cross(sub(b,a),sub(c,a)));
    for(const p of [a,b,c]) data.push(...p,...normal,paint,part);
  }
  function quad(a,b,c,d,paint,part) {
    tri(a,b,c,paint,part); tri(a,c,d,paint,part);
  }
  const nose=[0,.05,3.6], ridge=[0,.48,1.48], belly=[0,-.42,1.35];
  const stern=[0,.27,-2.63], base=[0,-.34,-2.63];
  for(const side of [-1,1]) {
    const p=(x,y,z)=>[side*x,y,z];
    const face=(a,b,c,paint,part)=>side>0?tri(a,c,b,paint,part):tri(a,b,c,paint,part);
    const plate=(a,b,c,d,paint,part)=>{face(a,b,c,paint,part);face(a,c,d,paint,part);};
    const shoulder=p(.61,.06,1.38), rear=p(.51,-.01,-2.58);
    face(nose,ridge,shoulder);
    plate(ridge,stern,rear,shoulder);
    face(nose,shoulder,belly,1);
    plate(belly,shoulder,rear,base,1);
    face(stern,base,rear,4);
    const root=p(.47,.022,.99), trailing=p(.47,.022,-1.29);
    const tip=p(3.6,.04,-1.34), tipBack=p(3.5,.03,-1.78);
    const band=p(2.62,.036,-.64), bandBack=p(2.62,.031,-1.43);
    const bandEnd=p(2.87,.037,-.82), bandEndBack=p(2.87,.032,-1.5);
    plate(trailing,bandBack,band,root,2);
    plate(bandBack,bandEndBack,bandEnd,band,5);
    plate(bandEndBack,tipBack,tip,bandEnd,1);
    plate(p(.69,.022,-1.96),tipBack,bandBack,trailing,4,side<0?1:2);
    const tailFront=p(.65,.13,-.9), tailTip=p(1.13,1.29,-1.78);
    const tailEnd=p(1.15,1.31,-2.18), tailBase=p(.71,.12,-2.63);
    plate(tailFront,tailTip,tailEnd,tailBase,1);
    plate(p(.685,.18,-2.60),p(.95,.77,-2.40),p(.96,.83,-2.38),p(.68,.24,-2.57),5);
    const glassFront=[0,.49,1.55], glassTop=[0,.84,.66], glassBack=[0,.41,-.72];
    const glassSide=p(.34,.34,.32);
    face(glassFront,glassTop,glassSide,3);
    face(glassTop,glassBack,glassSide,3);
    const lip=p(.38,.29,.31);
    face(glassFront,glassSide,lip,5);
    face(glassSide,glassBack,lip,4);
    tri(p(.46,-.03,-2.72),[0,.23,-2.72],[0,-.24,-2.72],4);
    tri(p(.43,0,-2.72),[0,.21,-2.72],[0,0,-6.7],6,3);
    tri(p(.43,0,-2.72),[0,-.21,-2.72],[0,0,-6.7],6,3);
    tri(p(.19,0,-2.73),[0,.10,-2.74],[0,0,-5.5],7,3);
  }
  return new Float32Array(data);
}
function setupGraphics() {
  gl.disable(gl.DITHER);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.ALWAYS);
  const landscape=program(screenVertex,landscapeFragment,'field resolution eye right up forward shadowCenter lens time shadowHeight steps loaded reflections titleView');
  const jet=program(jetVertex,jetFragment,'jetPosition eye attitude view resolution control lens thrust forward flicker visibility');
  const screenVao=gl.createVertexArray();
  const jetData=jetGeometry(), jetVao=gl.createVertexArray();
  gl.bindVertexArray(jetVao);
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER,jetData,gl.STATIC_DRAW);
  for(const [index,size,offset] of [[0,3,0],[1,3,12],[2,2,24]]) {
    gl.enableVertexAttribArray(index);
    gl.vertexAttribPointer(index,size,gl.FLOAT,false,32,offset);
  }
  const texture=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,texture);
  for(const [key,value] of [[gl.TEXTURE_MIN_FILTER,gl.NEAREST],[gl.TEXTURE_MAG_FILTER,gl.NEAREST],

async function boot() {
  requestAnimationFrame(draw);
  if(!gl) {failure='此浏览器无法开启三维画面';return;}
  world.addEventListener('webglcontextlost',event=>{
    event.preventDefault();
    failure='图形连接已中断，请刷新页面';
    ready=flying=false;renderWorld=null;paused=true;
    if(aircraft) sound(aircraft);
  });
  const building=buildTerrain();
  building.catch(()=>{});
  try {
    await paintFrame();
    const upload=setupGraphics();
    await building;
    progress=.81;loading='正在编译着色器…';
    upload();
    await paintFrame();
    progress=.94;loading='正在预热驾驶舱…';
    const warm=spawn();
    const warmCamera=titleCamera(0);
    renderWorld(warmCamera,0,warm);
    renderJet(warmCamera,warm,0,1);
    await paintFrame();
    progress=1;ready=true;
  } catch(error) {
    console.error(error);
    failure='湖区加载失败，请刷新页面';
  }
}
document.fonts.ready.then(()=>glyphs.clear());
document.fonts.addEventListener('loadingdone',()=>glyphs.clear());
boot();
</script>
</html>
