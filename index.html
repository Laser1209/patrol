<html lang="zh-CN">

<style>

canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}

<canvas id="world" aria-hidden="true"></canvas>
<canvas id="glass" aria-label="PATROL，按回车进入当前选项，按 C 切换飞行视角"></canvas>
<script>
'use strict';

// Palette: late sunlight bleaches peach into ivory, while wet rock falls into violet.
const colors = {
  ink:'#20182d', black:'#302039', plum:'#49304e', violet:'#654263',
  mauve:'#966079', haze:'#bc7e88', peach:'#edaa93', copper:'#b76b56',
  ochre:'#dd975b', gold:'#f8c685', cream:'#fff0c7', hot:'#fffbe6',
  slate:'#504b69', indigo:'#373857', red:'#ff927a', olive:'#777859',
  blue:'#50758c', mist:'#95aab3', overcast:'#768b98', frost:'#c8ced0', night:'#25263e'
};
const bayer = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const world = document.querySelector('#world');
const glass = document.querySelector('#glass');
const ctx = glass.getContext('2d');
const gl = world.getContext('webgl2', {antialias:false, alpha:false, depth:true});
const touch = matchMedia('(pointer:coarse)').matches || /Android|iPhone|iPad/.test(navigator.userAgent);
const clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));
const mix = (a,b,t) => a+(b-a)*t;
const smooth = t => t*t*(3-2*t);
const approach = (a,b,rate,dt) => mix(a,b,1-Math.exp(-rate*dt));
const rad = Math.PI/180;
const tile = 4096, fieldSize = 1024, cpuSize = 256;
const wrap = (value,size) => ((value%size)+size)%size;

// Terrain worker. Each stripe evaluates the same periodic, seeded field.
function terrainWorker() {
  function hash(x,z) {
    let n = Math.imul(x+71,374761393) ^ Math.imul(z+113,668265263);
    n = Math.imul(n ^ (n>>>13),1274126177);
    return ((n ^ (n>>>16))>>>0)/4294967295;
  }
  function noise(u,v,period) {
    const x = Math.floor(u*period), z = Math.floor(v*period);
    let a = u*period-x, b = v*period-z;
    a *= a*(3-2*a); b *= b*(3-2*b);
    const at = (i,j) => hash((i%period+period)%period,(j%period+period)%period);
    const lo = at(x,z)+(at(x+1,z)-at(x,z))*a;
    const hi = at(x,z+1)+(at(x+1,z+1)-at(x,z+1))*a;
    return lo+(hi-lo)*b;
  }
  self.onmessage = ({data:{start,end,size}}) => {
    const values = new Float32Array((end-start)*size);
    const tau = 2*Math.PI;
    for (let z=start;z<end;z++) {
      const v = (z+.5)/size;
      const bend = .13*Math.sin(tau*(v-.08))+.055*Math.sin(2*tau*v+1.3);
      for (let x=0;x<size;x++) {
        const u = (x+.5)/size;
        const crest = noise(u+.11,v,5)*.62+noise(u,v+.31,11)*.26+noise(u,v,26)*.12;
        const shore = Math.abs(Math.sin(Math.PI*(u-.53-bend)));
        const land = (shore-.31)*260+(noise(u,v,7)-.52)*64;
        const hills = Math.max(0,land+14)*(.33+crest*crest*2.45);
        const islands = Math.max(0,noise(u+.27,v+.12,9)-.72)*150;
        values[(z-start)*size+x] = land<0 ? land+islands : hills + (noise(u,v,61)-.62)*8-10;
      }
      if ((z-start+1)%32===0) self.postMessage({rows:z-start+1});
    }
    self.postMessage({start,values},[values.buffer]);
  };
}
const terrain = new Float32Array(fieldSize*fieldSize);
const cpuTerrain = new Float32Array(cpuSize*cpuSize);
let progress = 0, loading = '正在生成湖区地形…', ready = false, failure = '', terrainReady = false;
let renderWorld, renderJet;
function buildTerrain() {
  const count = Math.min(4,Math.max(2,navigator.hardwareConcurrency||2));
  const source = URL.createObjectURL(new Blob(['('+terrainWorker.toString()+')()'],{type:'text/javascript'}));
  const workers = [];
  const rows = new Array(count).fill(0);
  let completed = 0;
  return new Promise((resolve,reject) => {
    function closeWorkers() {
      for (const worker of workers) worker.terminate();
      URL.revokeObjectURL(source);
    }
    for (let index=0;index<count;index++) {
      const start = Math.floor(index*fieldSize/count), end = Math.floor((index+1)*fieldSize/count);
      const worker = new Worker(source);
      workers.push(worker);
      worker.onerror = event => {closeWorkers(); reject(new Error(event.message));};
      worker.onmessage = ({data}) => {
        if (data.values) {
          terrain.set(data.values,data.start*fieldSize);
          rows[index] = end-start;
          if (++completed===count) {closeWorkers(); resolve();}
        } else rows[index] = data.rows;
        progress = .76*rows.reduce((total,row) => total+row,0)/fieldSize;
      };
      worker.postMessage({start,end,size:fieldSize});
    }
  });
}
function heightAt(x,z) {
  const scale = cpuSize/tile;
  const column = x*scale-.5, row = z*scale-.5;
  const i = Math.floor(column), j = Math.floor(row);
  const at = (xIndex,zIndex) => cpuTerrain[wrap(zIndex,cpuSize)*cpuSize+wrap(xIndex,cpuSize)];
  const a = mix(at(i,j),at(i+1,j),column-i);
  const b = mix(at(i,j+1),at(i+1,j+1),column-i);
  const {relief,waterline}=flightEnvironment();
  return mix(a,b,row-j)*relief-waterline;
}
function solidHeight(x,z,environment=flightEnvironment()) {
  const scale = fieldSize/tile;
  return terrain[wrap(Math.floor(z*scale),fieldSize)*fieldSize+wrap(Math.floor(x*scale),fieldSize)]*
    environment.relief-environment.waterline;
}

// WebGL setup and shared ordered-color shader functions.
const colorGL = name => 'vec3('+colors[name].slice(1).match(/../g).map(v=>(parseInt(v,16)/255).toFixed(5)).join(',')+')';
const shaderColors = Object.keys(colors).map(name=>'const vec3 '+name+'='+colorGL(name)+';').join('\n');
const shaderCommon = `#version 300 es
precision highp float;
precision highp int;
${shaderColors}
uniform vec3 sun;
const float farClip=3900.;
float threshold() {
  const int matrix[16]=int[16](0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5);
  ivec2 p=ivec2(gl_FragCoord.xy)&3;
  return (float(matrix[p.y*4+p.x])+.5)/16.;
}
vec3 pairColor(vec3 a,vec3 b,float t) {return (t-.32)*2.78>threshold()?b:a;}
vec3 ramp(vec3 a,vec3 b,vec3 c,vec3 d,float amount) {
  float t=clamp(amount,0.,1.)*3.;
  return t<1.?pairColor(a,b,t):t<2.?pairColor(b,c,t-1.):pairColor(c,d,t-2.);
}
float hash(vec2 p) {
  vec3 p3=fract(vec3(p.xyx)*.1031);
  p3+=dot(p3,p3.yzx+33.33);
  return fract((p3.x+p3.y)*p3.z);
}
float noise(vec2 p) {
  vec2 i=floor(p), f=fract(p);
  f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);
}
float depthFor(float z) {return clamp(z/farClip,0.,.99999);}
`;
const screenVertex = `#version 300 es
void main(){
  vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));
  gl_Position=vec4(p*2.-1.,0.,1.);
}`;
const landscapeFragment = shaderCommon + `
out vec4 pixel;
uniform sampler2D field;
uniform vec2 resolution;
uniform vec3 eye, right, up, forward, shadowCenter;
uniform float lens, time, shadowHeight, cloudHeight;
uniform vec2 landShape, cloudWind;
uniform vec4 weather;
uniform int steps;
uniform bool loaded, reflections, titleView;
float heightAt(vec2 p) {return texture(field,fract(p/4096.)).r*landShape.x-landShape.y;}
float relief(vec2 p) {return max(0.,heightAt(p));}
vec3 hazeColor(vec3 ray) {
  float sunward=clamp(dot(normalize(vec2(ray.x,ray.z)+vec2(.0001)),normalize(sun.xz))*.5+.5,0.,1.);
  if(weather.w>2.5) return ramp(night,indigo,violet,mauve,sunward*.72);
  if(weather.w>1.5) return ramp(indigo,slate,overcast,mist,sunward*.75);
  if(weather.w>.5) return ramp(blue,overcast,mist,frost,sunward*.86);
  return ramp(mauve,haze,peach,gold,sunward*.89);
}
vec3 sky(vec3 ray,vec3 origin) {
  float heading=max(0.,dot(ray,sun));
  float rise=max(0.,ray.y);
  vec3 color=weather.w>2.5?ramp(hazeColor(ray),indigo,night,ink,pow(rise,.53)*1.52):
    weather.w>.5?ramp(hazeColor(ray),overcast,blue,slate,pow(rise,.53)*1.52):
    ramp(hazeColor(ray),haze,mauve,violet,pow(rise,.53)*1.52);
  float ring=1.-heading;
  if(ring<.041) color=pairColor(color,weather.w>.5?mist:peach,clamp((.041-ring)*19.*weather.z,0.,.85));
  if(ring<.012) color=pairColor(color,weather.w>.5?frost:gold,clamp((.012-ring)*76.*weather.z,0.,.93));
  if(ray.y>.018) {
    vec2 cloud=(origin.xz+ray.xz*((cloudHeight-min(cloudHeight-30.,origin.y))/ray.y))*vec2(.00173,.00310);
    cloud+=time*cloudWind;
    float layer=noise(cloud)*.62+noise(cloud*2.08)*.25+noise(cloud*4.11)*.13;
    float edge=weather.x+threshold()*.018;
    if(layer>edge && ray.y>.03) {
      float lit=clamp((layer-.57)*2.2+heading*.50+noise(cloud+vec2(.1,-.14))*.15,0.,1.);
      color=weather.w>2.5?ramp(night,indigo,slate,mauve,lit*.74):
        weather.w>.5?ramp(slate,overcast,mist,frost,lit*weather.z):ramp(violet,haze,peach,gold,lit);
      if(ray.y<.11) color=pairColor(color,hazeColor(ray),clamp(.55-ray.y*4.,0.,1.));
    }
  }
  if(ring<.0018) color=pairColor(color,cream,(.0018-ring)*530.*weather.z);
  if(ring<.00066 && weather.z>.65) color=hot;
  return color;
}
float march(vec3 origin,vec3 ray,float limit,int budget,bool reflection) {
  float distance=reflection?13.:1.5, previous=0.;
  for(int index=0;index<96;index++) {
    if(index>=budget || distance>=limit) break;
    vec3 p=origin+ray*distance;
    if(p.y>950. && ray.y>=0.) break;
    float ground=heightAt(p.xz);
    float gap=p.y-ground;
    if(gap<=0. && ground>=0.) {
      for(int refine=0;refine<2;refine++) {
        float halfWay=(distance+previous)*.5;
        vec3 q=origin+ray*halfWay;
        float h=heightAt(q.xz);
        if(h>=0. && q.y<=h) distance=halfWay; else previous=halfWay;
      }
      return distance;
    }
    previous=distance;
    distance+=clamp(gap*.46,4.+distance*.019,74.+distance*.018);
  }
  return -1.;
}
vec3 fog(vec3 color,vec3 ray,float distance,float altitude) {
  float amount=1.-exp(-distance*.00079*weather.y*exp(-max(altitude,0.)*.0039));
  vec3 distanceColor=weather.w>.5?pairColor(slate,hazeColor(ray),weather.y*.36):
    pairColor(mauve,haze,max(0.,dot(ray,sun)));
  if(amount>.68) return pairColor(distanceColor,hazeColor(ray),(amount-.68)*3.125);
  return pairColor(color,distanceColor,amount/.68);
}
vec3 landColor(vec3 p,vec3 ray,float distance,bool reflected) {
  vec2 stepSize=vec2(8.,0.);
  vec3 normal=normalize(vec3(relief(p.xz-stepSize.xy)-relief(p.xz+stepSize.xy),16.,
    relief(p.xz-stepSize.yx)-relief(p.xz+stepSize.yx)));
  float light=dot(normal,sun);
  float shade=0.;
  if(!reflected) {
    for(int i=1;i<=3;i++) {
      float hop=float(i*i)*12.;
      float blocker=heightAt(p.xz+sun.xz*hop)-p.y-sun.y*hop;
      shade=max(shade,clamp(blocker*.055,0.,1.));
    }
  }
  float grove=noise(p.xz*.035)*.62+noise(p.xz*.12)*.38;
  float exposure=clamp(.40+light*.89-shade*.27+(grove-.5)*.26,0.,1.);
  vec3 color;
  if(p.y<3.) color=ramp(indigo,plum,copper,ochre,exposure);
  else if(exposure<.43) color=ramp(ink,plum,slate,violet,exposure/.43);
  else if(grove<.45) color=ramp(violet,copper,ochre,gold,(exposure-.35)*1.38);
  else color=ramp(violet,mauve,copper,ochre,(exposure-.37)*1.48);
  if(weather.w>.5) color=ramp(ink,indigo,slate,weather.w<1.5?olive:overcast,exposure*weather.z);
  // Small stands break up the broad slope colors in the foreground.
  if(!reflected && distance<820. && p.y>8. && grove>.49) {
    float stand=hash(floor(p.xz*vec2(.33,.22)+vec2(floor(p.x*.16)*.5,0.)));
    if(stand>.87) color=pairColor(color,exposure>.64?copper:plum,(1.-distance/820.)*.75);
  }
  return fog(color,ray,distance,p.y);
}
void main(){
  vec2 uv=(2.*gl_FragCoord.xy-resolution)/resolution.y;
  vec3 ray=normalize(forward+(right*uv.x+up*uv.y)*lens);
  float water=ray.y<-.0001?-eye.y/ray.y:farClip;
  float distance=loaded?march(eye,ray,min(water+5.,farClip),steps,false):-1.;
  vec3 color;
  if(distance>0. && distance<=water+4.) {
    color=landColor(eye+ray*distance,ray,distance,false);
  } else if(water>0. && water<farClip) {
    distance=water;
    vec3 p=eye+ray*water;
    vec2 rippleCell=floor(p.xz*vec2(.34,.78));
    float wave=noise(rippleCell*vec2(.31,.13)+vec2(time*1.6,-time*2.1))-.5;
    float swell=noise(p.xz*vec2(.021,.079)+vec2(-time*.7,time*.82))-.5;
    vec3 mirror=normalize(vec3(ray.x+wave*.012,-ray.y+swell*.018,ray.z+wave*.006));
    vec3 reflected=sky(mirror,p);
    if(loaded && reflections && water<1450.) {
      float bounce=march(p+vec3(0,2.5,0),mirror,1250.,22,true);
      if(bounce>0.) reflected=pairColor(reflected,landColor(p+vec3(0,2.5,0)+mirror*bounce,mirror,bounce,true),
        (1.-bounce/1250.)*(1.-water/1850.)*.94);
    }
    float spec=max(0.,dot(mirror,sun));
    vec3 base=ramp(indigo,slate,violet,copper,clamp(.22+swell*.31+pow(spec,9.)*.66,0.,1.));
    vec3 tinted=reflected==hot||reflected==cream?gold:
      reflected==gold||reflected==peach?copper:reflected==haze?mauve:reflected;
    color=pairColor(base,tinted,clamp(.60+ray.y*.75+swell*.39,0.,.86));
    float glint=pow(spec,105.)*(wave+.5)*1.7*weather.z;
    if(glint>threshold()) color=glint>.73?cream:gold;
    color=fog(color,ray,water*.65,6.);
  } else {
    distance=farClip;
    color=sky(ray,eye);
  }
  if(shadowHeight>=0. && shadowHeight<80. && distance<farClip) {
    vec3 p=eye+ray*distance;
    vec2 offset=p.xz-shadowCenter.xz;
    if(p.y<1.) offset.x+=noise(floor(p.xz*.8)+time*3.)*1.6-.8;
    float spread=1.+shadowHeight*.024;
    float ellipse=length(vec2(offset.x/8.,offset.y/13.))/spread;
    float coverage=(1.-shadowHeight/80.)*clamp((1.1-ellipse)*2.,0.,.72);
    if(abs(p.y-shadowCenter.y)<13. && threshold()<coverage) color=p.y<1.?indigo:plum;
  }
  gl_FragDepth=depthFor(distance*dot(forward,ray));
  if(titleView && threshold()<.93) {
    if(color==hot) color=cream;
    else if(color==cream) color=gold;
    else if(color==gold) color=peach;
    else if(color==peach) color=haze;
    else if(color==haze) color=mauve;
    else if(color==mauve) color=violet;
    else if(color==copper||color==ochre) color=plum;
  }
  pixel=vec4(color,1.);
}`;

function program(vertex,fragment,names) {
  const id=gl.createProgram(), shaders=[];
  for(const [kind,source] of [[gl.VERTEX_SHADER,vertex],[gl.FRAGMENT_SHADER,fragment]]) {
    const shader=gl.createShader(kind);
    gl.shaderSource(shader,source);
    gl.compileShader(shader);
    gl.attachShader(id,shader);
    shaders.push(shader);
  }
  gl.linkProgram(id);
  if(!gl.getProgramParameter(id,gl.LINK_STATUS)) {
    const diagnostics=shaders.map(shader=>gl.getShaderInfoLog(shader)).join('\n');
    throw new Error(diagnostics+gl.getProgramInfoLog(id));
  }
  for(const shader of shaders) gl.deleteShader(shader);
  return {id,uniform:Object.fromEntries(names.split(' ').map(name=>[name,gl.getUniformLocation(id,name)]))};
}

// Low-poly toy. A single interleaved buffer holds the airframe and exhaust triangles.
const jetVertex = `#version 300 es
precision highp float;
layout(location=0) in vec3 vertex;
layout(location=1) in vec3 normal;
layout(location=2) in vec2 material;
uniform vec3 jetPosition,eye;
uniform mat3 attitude,view;
uniform vec2 resolution,control;
uniform vec2 screenOffset;
uniform float lens,thrust;
uniform float orthographic;
uniform vec2 propPivots;
uniform float propAngle;
out vec3 worldNormal;
out float viewDepth;
flat out float paint,part;
void main(){
  vec3 p=vertex, n=normal;
  paint=material.x; part=material.y;
  if(part==1. || part==2.) {
    float angle=control.x*.32+control.y*.42*(part==1.?-1.:1.);
    mat2 hinge=mat2(cos(angle),sin(angle),-sin(angle),cos(angle));
    p.yz=hinge*vec2(p.y,p.z+1.28)-vec2(0,1.28);
    n.yz=hinge*n.yz;
  }
  if(part==3.) p.z=-2.72+(p.z+2.72)*(.13+thrust*1.36);
  if(part>=4.) {
    vec2 hub=vec2(sign(p.x)*(part>=6.?propPivots.y:propPivots.x),.035);
    float angle=mod(part,2.)==0.?propAngle:-propAngle;
    mat2 spin=mat2(cos(angle),sin(angle),-sin(angle),cos(angle));
    p.xy=hub+spin*(p.xy-hub);
    n.xy=spin*n.xy;
  }
  vec3 camera=transpose(view)*(jetPosition+attitude*p-eye);
  worldNormal=attitude*n;
  viewDepth=camera.z;
  vec2 projected=vec2(camera.x*resolution.y/resolution.x,camera.y);
  gl_Position=orthographic>0.?vec4(projected*orthographic+screenOffset,0.,1.):
    vec4(projected/lens+camera.z*screenOffset,camera.z-.10,camera.z);
}`;
const jetFragment=shaderCommon+`
in vec3 worldNormal;
in float viewDepth;
flat in float paint,part;
uniform vec3 forward;
uniform float thrust,flicker,visibility;
uniform bool studio;
out vec4 pixel;
vec3 studioColor(vec3 n) {
  float light=clamp(.33+dot(n,normalize(vec3(-.38,.78,.54)))*.68,0.,1.);
  vec3 graphite=vec3(.16,.19,.24), shadow=vec3(.28,.33,.39), cool=vec3(.45,.51,.58);
  vec3 pale=vec3(.63,.69,.74), lightGray=vec3(.80,.84,.86), whiteGray=vec3(.89,.91,.92);
  if(paint==3.) return ramp(vec3(.11,.15,.20),graphite,shadow,cool,light);
  if(paint==4.) return ramp(vec3(.09,.10,.12),graphite,shadow,cool,light*.68);
  if(paint==14.) return ramp(graphite,shadow,cool,pale,light*.87);
  if(paint==15.) return ramp(graphite,vec3(.29,.36,.31),vec3(.39,.47,.37),pale,light);
  if(paint==12.) return vec3(.66,.25,.24);
  if(paint==13.) return lightGray;
  if(paint==9.||paint==10.) return ramp(graphite,shadow,cool,pale,light);
  if(paint==8.) return ramp(shadow,vec3(.36,.44,.53),vec3(.51,.61,.70),lightGray,light);
  if(paint==11.) return ramp(shadow,cool,pale,whiteGray,light);
  return ramp(shadow,cool,pale,lightGray,light);
}
void main(){
  if(visibility<threshold()) discard;
  vec3 color;
  if(part==3.) {
    if(thrust<.34 || threshold()>(paint>6.? .77:.39)+flicker*.17) discard;
    color=paint>6.?(thrust>.86?cream:gold):(flicker>0.?peach:copper);
  } else if(studio) color=studioColor(normalize(worldNormal));
  else {
    vec3 n=normalize(worldNormal);
    float light=clamp(dot(n,sun)*.78+.5,0.,1.);
    if(paint==1.) color=ramp(plum,copper,ochre,gold,light);
    else if(paint==2.) color=ramp(plum,slate,mauve,cream,light);
    else if(paint==3.) color=ramp(ink,indigo,slate,haze,light);
    else if(paint==4.) color=ramp(ink,plum,slate,violet,light);
    else if(paint==5.) color=ramp(plum,mauve,peach,cream,light);
    else if(paint==8.) color=ramp(indigo,slate,violet,haze,light);
    else if(paint==9.) color=ramp(ink,slate,mauve,haze,light);
    else if(paint==10.) color=ramp(ink,slate,violet,mauve,light);
    else if(paint==11.) color=ramp(violet,mauve,peach,cream,light);
    else if(paint==12.) color=red;
    else if(paint==13.) color=cream;
    else if(paint==14.) color=ramp(indigo,violet,copper,gold,light);
    else if(paint==15.) color=ramp(plum,slate,olive,gold,light);
    else color=ramp(slate,mauve,peach,cream,light);
    if(paint!=4. && paint<12. && dot(n,normalize(sun-forward))>.84) color=paint==3.?peach:hot;
  }
  gl_FragDepth=depthFor(viewDepth);
  pixel=vec4(color,1.);
}`;
const add = (a,b) => a.map((v,i)=>v+b[i]);
const sub = (a,b) => a.map((v,i)=>v-b[i]);
const mul = (a,k) => a.map(v=>v*k);
const dot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross = (a,b) => [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const length = a => Math.hypot(...a);
const unit = a => mul(a,1/(length(a)||1));

  const {agl,velocity,stall,speed}=aircraft;
  warning=agl<17 && (velocity[1]<2||agl<8)?'拉起':stall?'失速':speed<aero.cruise*.53?'低速':speed>109?'超速':'';
  impact=Math.max(0,impact-dt*2.3);
  for(let i=particles.length-1;i>=0;i--) {
    const p=particles[i];
    p.life-=dt;
    if(p.life<=0) {particles.splice(i,1);continue;}
    p.velocity[1]-=dt*27;
    for(let axis=0;axis<3;axis++) p.position[axis]+=p.velocity[axis]*dt;
  }
  if(!lanMatch) updateTutorial(dt);
  updateAircraftDamage(dt);
  updateMission(dt);
  updateWingman(dt);

// Friendly autopilot. The wingmate owns its own pose and stays out of the hostile contact list.
const wingmanModes=['follow','assist','rejoin'];
let wingmanEnabled=true, wingman=null;

function makeWingman(model,pose,health=100,mode='follow') {
  return {model,mode,health,current:pose,previous:pose,cooldown:0,scanTime:0,
    target:null,contactTime:0,status:health>0?'跟随中':'已脱离'};
}

function resetWingman(modelIndex) {
  wingman=null;
  const forced=Number.isInteger(modelIndex)&&aircraftModels[modelIndex];
  if(!wingmanEnabled&&!forced || !aircraft) return;
  const model=forced?modelIndex:selectedModel().role==='bomber'?0:selectedAircraft;
  const forward=radarHeading(aircraft), right=[forward[2],0,-forward[0]];
  const position=add(add(aircraft.position,mul(forward,33)),mul(right,18));
  position[1]=Math.max(position[1]+3,solidHeight(position[0],position[2])+16);
  const heading=Math.atan2(forward[0],forward[2]);
  wingman=makeWingman(model,{position,velocity:aircraft.velocity.slice(),
    attitude:axisAngle([0,1,0],heading),heading,thrust:.55,stick:[0,0,0]});
}

function commandWingman(mode) {
  if(!flying || paused || !wingman?.health || !wingmanModes.includes(mode)) return false;
  wingman.mode=mode;
  return true;
}

function cycleWingmanCommand() {
  if(!wingman) return false;
  return commandWingman(wingmanModes[(wingmanModes.indexOf(wingman.mode)+1)%wingmanModes.length]);
}

function wingmanSnapshot() {
  if(!wingman) return null;
  const {model,health,mode,current}=wingman;
  const {position,velocity,attitude,heading,thrust}=current;
  return {model,health,mode,position:position.slice(),velocity:velocity.slice(),
    attitude:attitude.slice(),heading,thrust};
}

function restoreWingman(saved) {
  if(saved===null) {wingman=null;return;}
  const validVector=(value,size)=>Array.isArray(value)&&value.length===size&&value.every(Number.isFinite);
  if(!saved || !Number.isInteger(saved.model) || !aircraftModels[saved.model] ||
    !validVector(saved.position,3) || !validVector(saved.velocity,3) || !validVector(saved.attitude,4) ||
    !Number.isFinite(saved.heading) || !Number.isFinite(saved.thrust) || !Number.isFinite(saved.health) ||
    Math.abs(length(saved.attitude)-1)>.01 || !wingmanModes.includes(saved.mode)) {
    resetWingman();return;
  }
  const {model,health,mode,position,velocity,attitude,heading,thrust}=saved;
  wingman=makeWingman(model,{position:position.slice(),velocity:velocity.slice(),attitude:attitude.slice(),
    heading,thrust:clamp(thrust,0,1),stick:[0,0,0]},clamp(health,0,100),mode);
}

function updateWingman(dt) {
  if(!wingman || !mission) return;
  const ally=wingman, pose=ally.current;
  ally.previous=pose;
  if(ally.health<=0) {ally.status='已脱离';return;}

  const leaderVelocity=aircraft.velocity;
  const forward=Math.hypot(leaderVelocity[0],leaderVelocity[2])>12?
    unit([leaderVelocity[0],0,leaderVelocity[2]]):radarHeading(aircraft);
  const right=[forward[2],0,-forward[0]];
  const desired=add(add(aircraft.position,mul(forward,-19)),mul(right,23));
  desired[1]+=5;
  const distance=length(sub(pose.position,aircraft.position));
  const returning=ally.mode==='rejoin'||distance>106;
  const escort=mission.config.role==='bomber';
  const supporting=(ally.mode==='assist'||escort)&&!returning&&!mission.complete&&!mission.recoveryTime;
  ally.cooldown=Math.max(0,ally.cooldown-dt);
  ally.scanTime-=dt;
  if(ally.scanTime<=0) {
    ally.scanTime=.18;
    ally.target=null;
    let nearest=174;
    for(const target of mission.targets) {
      if(!supporting || target===mission.locked || target.health<=1 || !isAirContact(target)) continue;
      const range=length(sub(target.position,pose.position));
      if(range<nearest && length(sub(target.position,aircraft.position))<195) {
        nearest=range;ally.target=target;
      }
    }
    // The scripted hazard keeps the toy wingmate vulnerable near hostile contacts.
    // It uses only game-space range and elapsed time, independent of player equipment.
    const nearHostiles=mission.config.skill>0&&mission.targets.some(target=>target.health>0&&
      isAirContact(target)&&length(sub(target.position,pose.position))<72);
    ally.contactTime=nearHostiles?ally.contactTime+.18:Math.max(0,ally.contactTime-.45);
    if(ally.contactTime>=4) {
      ally.health=Math.max(0,ally.health-14);
      ally.contactTime=0;
      if(ally.health===0) {
        ally.status='已脱离';
        createBurst(pose.position,false);
        return;
      }
    }
  }

  const target=supporting&&ally.target?.health>1&&ally.target!==mission.locked?ally.target:null;
  const active=target&&mission.targets.includes(target);
  ally.status=returning?'返队中':active?'交战中':escort?'护航中':'跟随中';
  if(ally.mode==='rejoin'&&length(sub(desired,pose.position))<13) ally.mode='follow';
  if(active) {
    // Shift within the formation instead of leaving the player's view to chase a contact.
    desired[0]+=clamp((target.position[0]-desired[0])*.20,-24,24);
    desired[2]+=clamp((target.position[2]-desired[2])*.20,-24,24);
    desired[1]+=clamp((target.position[1]-desired[1])*.12,-5,13);
    if(!ally.cooldown && length(sub(target.position,pose.position))<142 &&
      clearSight(pose.position,target.position)) {
      ally.cooldown=1.65;
      mission.effects.push({kind:'pulse',friendly:true,life:cannonTraceTime,
        origin:pose.position.slice(),position:target.position.slice()});
      scoreHit(target,Math.min(3,target.health-1));
    }
  }

  // Borrow the leader's velocity and correct the moving slot error proportionally.
  // Heading and speed change continuously so a sharp reversal never teleports the wingmate.
  const error=sub(desired,pose.position);
  const motion=[leaderVelocity[0]+error[0]*.85,0,leaderVelocity[2]+error[2]*.85];
  const headingGoal=Math.hypot(motion[0],motion[2])>2?Math.atan2(motion[0],motion[2]):pose.heading;
  const headingError=wrap(headingGoal-pose.heading+Math.PI,2*Math.PI)-Math.PI;
  const heading=pose.heading+clamp(headingError*2.7,-1.42,1.42)*dt;
  const desiredSpeed=clamp(length(motion),23,122);
  const speed=approach(Math.hypot(pose.velocity[0],pose.velocity[2]),desiredSpeed,2.3,dt);
  const vx=Math.sin(heading)*speed, vz=Math.cos(heading)*speed;
  let safeY=desired[1];
  for(const ahead of [0,.32,.76]) {
    const surface=Math.max(0,solidHeight(pose.position[0]+vx*ahead,pose.position[2]+vz*ahead));
    safeY=Math.max(safeY,surface+14);
  }
  const climb=clamp((safeY-pose.position[1])*2.2+clamp(leaderVelocity[1]*.34,-9,9),-23,39);
  let vy=approach(pose.velocity[1],climb,4.3,dt);
  const position=add(pose.position,[vx*dt,vy*dt,vz*dt]);
  const floor=Math.max(0,solidHeight(position[0],position[2]))+4;
  if(position[1]<floor) {
    position[1]=floor;
    vy=Math.max(6,vy);
  }
  const bank=clamp(headingError*.78,-.66,.66);
  const pitch=Math.atan2(vy,speed);
  const attitude=quatMultiply(quatMultiply(axisAngle([0,1,0],heading),axisAngle([1,0,0],-pitch)),
    axisAngle([0,0,1],-bank));
  ally.current={position,velocity:[vx,vy,vz],
    attitude:blendAttitude(pose.attitude,attitude,1-Math.exp(-6.4*dt)),
    heading,thrust:approach(pose.thrust,clamp(.22+speed*.0055,.32,1),2.2,dt),
    stick:[-pitch,bank,0]};
}

function wingmanPose(alpha) {
  if(!wingman?.health) return null;
  const {previous,current}=wingman;
  return {...current,position:blend(previous.position,current.position,alpha),
    attitude:blendAttitude(previous.attitude,current.attitude,alpha)};
}

function renderWingman(cam,time,alpha) {
  const pose=wingmanPose(alpha);
  if(!pose || !insideView(project(pose.position,cam),-20) || !clearSight(cam.eye,pose.position)) return;
  renderJet(cam,pose,time,1,[0,0],wingman.model);
}

function drawWingmanMarker(cam,alpha) {
  const pose=wingmanPose(alpha);
  if(!pose) return;
  const point=project(pose.position,cam);
  if(!insideView(point,12) || point[1]<69 || point[1]>height-88 || !clearSight(cam.eye,pose.position)) return;
  const [x,y]=point;
  const markerY=y-Math.max(9,Math.min(33,690/length(sub(pose.position,cam.eye))));
  line(x-4,markerY,x+4,markerY,colors.mist);
  line(x-4,markerY,x-4,markerY+3,colors.mist);
  line(x+4,markerY,x+4,markerY+3,colors.mist);
  type('僚机',x,markerY-4,8,colors.frost,'mono','center');

function wingmanRadarDot(s,{x,y,radius,scope,occupied}) {
  if(!wingman?.health) return;
  const forward=radarHeading(s), right=[forward[2],0,-forward[0]];
  const difference=sub(wingman.current.position,s.position);
  const offset=[dot(difference,right),-dot(difference,forward)];
  const scale=radius/Math.max(scope,Math.hypot(...offset));
  const px=Math.round(x+offset[0]*scale), py=Math.round(y+offset[1]*scale);
  const shift=radarMarkerOffsets.find(([dx,dy])=>
    Math.abs(px+dx-x)<=radius+2 && Math.abs(py+dy-y)<=radius+2 &&
    occupied.every(([ox,oy])=>Math.abs(ox-px-dx)>3||Math.abs(oy-py-dy)>3))||[0,0];
  const mx=px+shift[0], my=py+shift[1];
  occupied.push([mx,my]);
  border(mx-2,my-2,5,5,colors.mist);
  rect(mx-1,my-1,3,3,colors.ink);
  rect(mx,my,1,1,colors.frost);
}

function drawWingmanHud() {
  if(!wingman || paused) return;
  const health=wingman.health;
  const command=['编队','协同','返队'][wingmanModes.indexOf(wingman.mode)];
  const label=health>0?'僚机 · '+wingman.status:'僚机 · 已脱离';
  const x=screenInsets[3]+13, y=screenInsets[0]+(width<330?46:41);
  const w=touch?87:100, h=15;
  rect(x,y,w,h,colors.ink);
  corners(x,y,w-1,h-1,4,health>0?colors.mist:colors.haze);
  type(label,x+5,y+10,8,health>0?colors.frost:colors.haze);
  if(health<=0) return;
  const glow=health<30?colors.red:colors.mist;
  rect(x+w-21,y+10,15,2,colors.blue);
  rect(x+w-21,y+10,Math.ceil(health*.15),2,glow);

  type(command,x+w-13,y+8,6,glow,'mono','center');
  hitBoxes.wingmanCommand=[x,y,w,h];
}

// View switching. The longitudinal eye offset varies monotonically along the nose axis.

}

  const flightDirection=unit(s.velocity);
  const target=unit(blend(nose,flightDirection,mix(.025,.28,viewBlend)));
  const scale=selectedModel().role==='bomber'?1.42:1;
  const chaseDistance=(mix(15,25,speedFactor)-Math.max(0,s.g-1.65)*1.2)*scale;
  const eyeOffset=add(mul(up,mix(.94,mix(6.5,9.2,speedFactor)*scale,viewBlend)),mul(nose,mix(.54,-chaseDistance,viewBlend)));

  [camera.anchor,camera.velocity]=spring(camera.anchor,camera.velocity,anchor,mix(25,10,viewBlend),dt);

function titleCamera(time) {

  const mark=Math.floor(value/increment);
  for(let i=mark-4;i<=mark+4;i++) {
    const tick=Math.round(y+(value-i*increment)*2.15);
    if(tick<=y-span||tick>=y+span||Math.abs(tick-y)<9) continue;
    const wide=i%2===0;
    line(x,tick,x+side*(wide?7:4),tick,dim);
    if(wide&&i*increment>=0 && width>=292) type(String(i*increment),x+side*10,tick+2,7,dim,'mono',side<0?'right':'left');
  }
  const tagX=side<0?near-35:near-1;
  rect(tagX,y-8,36,17,pattern(colors.ink,12));
  border(tagX,y-8,36,17,hud);
  type(String(Math.round(value)),tagX+18,y+4,10,hud,'mono','center');

// Audio voices share a compressor and open only on the launch gesture.
let audio=null;

  lock:[740,.10,.042],incoming:[930,.23,.058],impact:[113,.36,.088]};

  node.frequency.exponentialRampToValueAtTime(frequency*(name==='lock'?1.4:.47),start+duration);
  gain.gain.setValueAtTime(volume,start);
  gain.gain.exponentialRampToValueAtTime(.001,start+duration);

  node.onended=()=>{node.disconnect();gain.disconnect();};

}

  const samples=buffer.getChannelData(0);
  let seed=86487997;
  for(let i=0;i<samples.length;i++) {
    seed=(Math.imul(1664525,seed)+1013904223)>>>0;
    samples[i]=seed/2147483648-1;
  }

    const filter=context.createBiquadFilter(), gain=context.createGain();

    filter.connect(gain).connect(master);

    lake=voice('bandpass',1050,0), whirr=voice('bandpass',510,0);

  noiseSource.connect(engine.filter);
  noiseSource.connect(wind.filter);noiseSource.connect(lake.filter);

    const node=context.createOscillator(), trim=context.createGain();

    oscillator('sawtooth',122,.09,engine.filter)];

function sound(s) {
  if(!audio) return;

  const now=context.currentTime;
  const set=(property,value,lag=.09)=>property.setTargetAtTime(value,now,lag);
  set(master.gain,paused||document.hidden?0:.63);
  const rpm=30+s.thrust*44+s.speed*.22;
  turbines.forEach((turbine,index)=>set(turbine.frequency,rpm*(index+1)*(index===1?1.013:1)));
  set(engine.filter.frequency,138+s.thrust*455+s.speed*1.58);

// Campaign checkpoints. Persist a compact snapshot and resolve target references by index.
const checkpointKey='patrol.checkpoint.v1';

    if(data?.version===1 && aircraftModels[data.model] && missions[data.level] &&
      vector(data.flight?.position,3) && vector(data.flight?.velocity,3) &&
      vector(data.flight?.attitude,4) && vector(data.flight?.stick,3) && vector(data.flight?.rates,3) &&
      Array.isArray(data.targets) && data.targets.every(target=>targetNames[target.kind]&&vector(target.position,3)) &&
      Number.isFinite(data.time)&&data.status?.zones&&data.effects?.every(effect=>Number.isInteger(effect.targetIndex))&&
      Array.isArray(data.tutorial?.milestones)) return data;

function saveCheckpoint() {
  if(!flying || !mission || lanMatch) return;

    missileReserve,missileReload,tracerTime}=mission;

    flight:aircraft, targets:mission.targets, lock:mission.targets.indexOf(mission.locked), charge:mission.charge,

  if(typeof data.session!=='string'||!/^[0-9a-f]{32}$/.test(data.session)||

      resolve(peer.localDescription);

function lanSendControl(message) {

}

  lan[key]=channel;
  channel.addEventListener('open',()=>{if(epoch===lan.epoch) finishLanHandshake();});
  channel.addEventListener('close',()=>{
    if(epoch===lan.epoch) failLanPeer(lan.connected?'对方已离开，连接结束':'连接未建立，请重新交换连接码');

  } else peer.addEventListener('datachannel',event=>{

async function createLanInvitation() {
  let epoch;
  try {
    const session=Array.from(crypto.getRandomValues(new Uint8Array(16)),byte=>byte.toString(16).padStart(2,'0')).join('');
    const connection=createLanPeer('host',session);
    const {peer}=connection;
    epoch=connection.epoch;
    lan.phase='gathering';
    await peer.setLocalDescription(await peer.createOffer());
    const description=await gatherLanDescription(peer,epoch);
    if(epoch!==lan.epoch) return;
    const invite=encodeLanCode('offer',description);
    decodeLanCode(invite,'offer');
    Object.assign(lan,{invite,phase:'invite'});
  } catch(error) {
    if(epoch===undefined||epoch===lan.epoch)
      failLanPeer(error instanceof Error&&error.message.includes('局域网')?error.message:'无法生成邀请，请检查浏览器网络权限');
  }
}
async function acceptLanInvitation(value) {
  const offer=decodeLanCode(value,'offer');

  const {peer,epoch}=createLanPeer('guest',offer.session);
  lan.phase='gathering';
  try {
    await peer.setRemoteDescription({type:'offer',sdp:offer.sdp});
    await peer.setLocalDescription(await peer.createAnswer());
    const description=await gatherLanDescription(peer,epoch);
    if(epoch!==lan.epoch) return;
    const response=encodeLanCode('answer',description);
    decodeLanCode(response,'answer');
    Object.assign(lan,{response,phase:'connecting'});
    setLanConnectionTimer(epoch,90000);
  } catch {
    if(epoch===lan.epoch) failLanPeer('无法生成回执，请检查邀请和浏览器网络权限');
  }
}
async function acceptLanResponse(value) {
  const response=decodeLanCode(value,'answer');
  if(lan.role!=='host'||lan.phase!=='invite'||response.session!==lan.session) throw new Error('此回执与当前邀请不匹配');
  const {peer,epoch}=lan;
  try {await peer.setRemoteDescription({type:'answer',sdp:response.sdp});}
  catch {throw new Error('无法读取回执，请完整复制后重试');}

}
function sendLanSetup() {

function sendLanChoice() {

  if(packet.kind==='leave') {failLanPeer('对方已离开，连接结束');return;}
  if(packet.kind==='setup'&&lan.role==='guest'&&lan.phase!=='playing'&&
    Number.isSafeInteger(packet.revision)&&packet.revision>=lan.revision&&lanStageValid(packet.mode,packet.stage)&&lanModelValid(packet.aircraft)) {
    const changed=packet.revision!==lan.revision;

    if(output) {
      textArea.select();

        else if(!document.execCommand('copy')) throw new Error();

      } catch {message.textContent='文本已选中，请手动复制';}

      if(kind==='join') await acceptLanInvitation(textArea.value);

function handleLanRoomKey(event) {
  if(event.code==='Escape'||event.code==='Backspace') {

function handleLanRoomPointer(point) {
  const hit=key=>inside(point,hitBoxes[key]);
  if(hit('lanBack')) leaveLanScreen();
  else if(hit('lanCreate')) void createLanInvitation().then(()=>{if(lan.phase==='invite') showLanCode('invite');});
  else if(hit('lanJoin')) showLanCode('join');
  else if(hit('lanInvite')) showLanCode('invite');
  else if(hit('lanConfirm')) showLanCode('confirm');
  else if(hit('lanResponse')) showLanCode('response');
  else if(hit('lanPve')) setLanMode('pve');
  else if(hit('lanPvp')) setLanMode('pvp');
  else if(hit('lanMap')) {
    const choices=lanStages[lan.mode];
    setLanRoomRules(lan.mode,choices[(choices.indexOf(lan.stage)+1)%choices.length]);
  }
  else if(hit('lanAircraft')) enterHangar('lan');
  else if(hit('lanReady')) toggleLanReady();
  else if(hit('lanStart')) startLanRoomMatch();

  return true;
}

function lanSeatContext(match,run) {

function lanSpawnSeat(state,mode,role) {
  const side=role==='host'?-1:1;
  if(mode==='pve') {
    const offset=rotate(state.attitude,[side*18,0,0]);
    state.position=add(state.position,offset);
  } else {
    const [x,,z]=routePoint(2200,0,620);
    const separation=195;
    const altitude=90+Math.max(0,solidHeight(x,z-separation),solidHeight(x,z+separation));
    state.position=[x,altitude,z+side*separation];
    state.attitude=axisAngle([0,1,0],role==='host'?0:Math.PI);
    state.velocity=add(mul(rotate(state.attitude,[0,0,1]),state.speed),flightEnvironment().wind);
  }
  state.agl=state.position[1]-Math.max(0,solidHeight(state.position[0],state.position[2]));
  return state;
}

const flightKeys=new Set(['KeyW','KeyS','KeyA','KeyD','KeyQ','KeyE','ShiftLeft','ShiftRight','ControlLeft','ControlRight']);
const actionKeys=new Set(['Enter','Escape','KeyC','KeyR','KeyP','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Backspace',
  'KeyJ','KeyK','KeyL','KeyT','KeyU','KeyB','KeyN']);
function handleEntryKey(code) {
  if(code==='Enter') {
    if(entryScreen==='hangar') launch();
    else if(entryScreen==='briefing') enterHangar();
    else if(entryScreen==='missions') openMissionBriefing();
    else if(entryScreen==='title') {
      if(checkpoint) resumeCheckpoint(); else openMissionSelection();
    }
  } else if(code==='Escape' || code==='Backspace') {
    if(entryScreen==='hangar') closeHangar();
    else if(entryScreen==='briefing') closeBriefing();
    else if(entryScreen==='missions'||entryScreen==='controls') entryScreen='title';
    else if(code==='Escape') skipTutorial();
  } else if(entryScreen==='hangar' && (code==='ArrowLeft'||code==='ArrowRight')) {
    changeAircraft(code==='ArrowLeft'?-1:1);
  } else if(entryScreen==='missions' && (code==='ArrowUp'||code==='ArrowDown')) {
    changeMission(code==='ArrowUp'?-1:1);
  }
}
addEventListener('keydown',event=>{
  if(!flying&&entryScreen==='lan') {if(handleLanRoomKey(event)) event.preventDefault();return;}
  if(event.metaKey || !flightKeys.has(event.code)&&!actionKeys.has(event.code)) return;
  if(event.ctrlKey&&!flying&&!event.code.startsWith('Control')) return;
  event.preventDefault();
  if(!flying) {if(!event.repeat) handleEntryKey(event.code);return;}
  keys.add(event.code);
  if(event.repeat) return;
  if(event.code==='Enter'&&paused) togglePause();
  if(event.code==='Enter'&&lanMatch && handleLanFlightEnter()) return;
  if(event.code==='Backspace') returnToTitle();
  if(event.code==='Escape'||event.code==='KeyP') togglePause();
  if(lanInputBlocked()) return;
  if(event.code==='KeyN') openNextChapter();
  if(event.code==='KeyC') toggleView();
  if(event.code==='KeyR') restartMission();
  if(flying&&!paused && event.code==='KeyT' && !lanInputAction('cycle')) cycleTarget(true);
  if(flying&&!paused && event.code==='KeyU') cycleWingmanCommand();
  if(flying&&!paused && event.code==='KeyL' && !lanInputAction('decoy')) dropDecoy();
  if(flying&&!paused && event.code==='KeyJ' && !lanInputAction('pulse')) firePulse();
  if(flying&&!paused && event.code==='KeyK' && !lanInputAction('tracer')) fireTracer();
  if(flying&&!paused && event.code==='KeyB') deliverBeacon();
});
addEventListener('keyup',event=>keys.delete(event.code));

  keys.clear();combatPointers.clear();drag=null;hangarDrag=null;throttlePointer=null;touchThrottle=null;
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) {keys.clear();combatPointers.clear();}
  if(audio&&aircraft) sound(aircraft);
});
const inside=(p,b)=>b && p[0]>=b[0]&&p[0]<b[0]+b[2]&&p[1]>=b[1]&&p[1]<b[1]+b[3];
const pointer=event=>{
  const bounds=glass.getBoundingClientRect();
  return [(event.clientX-bounds.left)*width/bounds.width,(event.clientY-bounds.top)*height/bounds.height];
};
let throttlePointer=null;
function throttleAt(y) {
  const [,top,,h]=hitBoxes.throttle;
  touchThrottle=clamp(1-(y-top-5)/(h-10),0,1);
}
glass.addEventListener('pointerdown',event=>{
  if(event.button!==0) return;
  const p=pointer(event);
  if(entryScreen==='hangar'&&!flying) {
    if(inside(p,hitBoxes.closeHangar)) closeHangar();
    else if(inside(p,hitBoxes.confirmSortie)) launch();
    else if(inside(p,hitBoxes.wingmanOption)) wingmanEnabled=!wingmanEnabled;
    else {
      const choice=hitBoxes.aircraftChoices?.find(entry=>inside(p,entry.slot));
      const view=hitBoxes.hangarViews?.findIndex(slot=>inside(p,slot))??-1;
      if(view>=0) hangarView=view;
      else if(choice) selectedAircraft=choice.index;
      else if(hangarView===0) {
        hangarDrag={id:event.pointerId,point:p};
        glass.setPointerCapture(event.pointerId);
      }
    }
    return;
  }
  if(!flying) {
    if(entryScreen==='lan') {handleLanRoomPointer(p);return;}
    if(inside(p,hitBoxes.closeBrief)) closeBriefing();
    else if(inside(p,hitBoxes.executeBrief)) enterHangar();
    else if(inside(p,hitBoxes.backToTitle)) entryScreen='title';
    else if(inside(p,hitBoxes.newMission)) openMissionSelection();
    else if(inside(p,hitBoxes.resumeCheckpoint)) resumeCheckpoint();
    else if(inside(p,hitBoxes.controls)) entryScreen='controls';
    else if(inside(p,hitBoxes.openLan)) openLanEntry();
    else if(inside(p,hitBoxes.missionBrief)) openMissionBriefing();
    else {
      const choice=hitBoxes.missionChoices?.find(entry=>inside(p,entry.slot));
      if(choice) {selectedMission=choice.index;fitAircraftToMission();}
    }
    return;
  }
  if(lanMatch && handleLanFlightPointer(p)) return;
  if(inside(p,hitBoxes.returnToTitle)) {returnToTitle();return;}
  if(inside(p,hitBoxes.pause) || inside(p,hitBoxes.continueFlight)) {togglePause();return;}
  if(inside(p,hitBoxes.restartMission)) {restartMission();return;}
  if(paused) return;
  if(inside(p,hitBoxes.wingmanCommand)) {cycleWingmanCommand();return;}
  if(inside(p,hitBoxes.nextChapter)) {openNextChapter();return;}
  if(inside(p,hitBoxes.beaconDrop)) {deliverBeacon();return;}
  if(selectRadarContact(p)) return;
  if(inside(p,hitBoxes.cycleTarget)) {if(!lanInputAction('cycle')) cycleTarget(true);return;}
  if(inside(p,hitBoxes.decoy)) {if(!lanInputAction('decoy')) dropDecoy();return;}
  if(inside(p,hitBoxes.pulse) || inside(p,hitBoxes.tracer)) {
    const action=inside(p,hitBoxes.pulse)?'pulse':'tracer';
    combatPointers.set(action,event.pointerId);
    glass.setPointerCapture(event.pointerId);
    if(!lanInputAction(action)) {if(action==='pulse') firePulse(); else fireTracer();}
    return;
  }
  if(inside(p,hitBoxes.view)) {toggleView();return;}
  if(inside(p,hitBoxes.throttle)) {
    throttlePointer=event.pointerId;
    throttleAt(p[1]);
  } else if(!drag && (!touch||inside(p,hitBoxes.stick))) {
    const box=hitBoxes.stick;
    drag={id:event.pointerId,x:touch?box[0]+box[2]/2:p[0],y:touch?box[1]+box[3]/2:p[1],pitch:0,roll:0};
  } else return;
  glass.setPointerCapture(event.pointerId);
  event.preventDefault();
});
glass.addEventListener('pointermove',event=>{
  const p=pointer(event);
  if(hangarDrag?.id===event.pointerId) {
    hangarYaw-= (p[0]-hangarDrag.point[0])*.015;
    hangarPitch=clamp(hangarPitch+(p[1]-hangarDrag.point[1])*.009,-1.05,1.05);
    hangarDrag.point=p;
  }
  const overButton=Object.values(hitBoxes).some(box=>Array.isArray(box)&&box.length===4&&box.every(Number.isFinite)&&inside(p,box)) ||
    hitBoxes.aircraftChoices?.some(entry=>inside(p,entry.slot)) ||
    hitBoxes.missionChoices?.some(entry=>inside(p,entry.slot)) ||
    hitBoxes.hangarViews?.some(slot=>inside(p,slot)) ||
    hitBoxes.radarTargets?.some(point=>Math.hypot(p[0]-point.x,p[1]-point.y)<8);
  glass.style.cursor=overButton?'pointer':entryScreen==='hangar'&&!flying?(hangarDrag?'grabbing':'grab'):
    flying&&!touch&&!paused?'crosshair':'default';
  if(event.pointerId===throttlePointer) throttleAt(p[1]);
  if(drag?.id===event.pointerId) {
    const reach=touch?24:44;
    drag.roll=clamp((p[0]-drag.x)/reach,-1,1);
    drag.pitch=clamp((drag.y-p[1])/reach,-1,1);
  }
});
for(const eventName of ['pointerup','pointercancel','lostpointercapture']) glass.addEventListener(eventName,event=>{
  if(hangarDrag?.id===event.pointerId) hangarDrag=null;
  for(const [action,id] of combatPointers) if(id===event.pointerId) combatPointers.delete(action);
  if(drag?.id===event.pointerId) drag=null;
  if(throttlePointer===event.pointerId) {
    if(touchThrottle!==null && aircraft) aircraft.throttle=touchThrottle;
    throttlePointer=null;touchThrottle=null;
  }
});

// Main loop. Quality changes are applied between frames, with hysteresis.
const safeArea=document.createElement('div');
safeArea.style.cssText='position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
document.body.append(safeArea);
const resolutionLevels=[432,368,306,264];
const worldResolutionLevels=[600,512,432,352];
let resizePending=true;
addEventListener('resize',()=>{resizePending=true;});
function resize() {
  height=resolutionLevels[quality];
  // Preserve readable controls in portrait while keeping square pixels.
  const aspect=innerWidth/innerHeight;
  if(aspect<.70) height=Math.max(height,Math.ceil([216,197,182,171][quality]/aspect));
  width=Math.round(height*aspect);
  const worldHeight=Math.max(worldResolutionLevels[quality],height);
  world.height=worldHeight;
  world.width=Math.round(worldHeight*aspect);
  glass.width=canopy.width=width*hudScale;
  glass.height=canopy.height=height*hudScale;
  ctx.setTransform(hudScale,0,0,hudScale,0,0);
  ctx.imageSmoothingEnabled=false;
  const style=getComputedStyle(safeArea);
  screenInsets=['paddingTop','paddingRight','paddingBottom','paddingLeft'].map(key=>Math.ceil(parseFloat(style[key])*height/innerHeight));
  if(gl) gl.viewport(0,0,world.width,world.height);
  resizePending=false;
}
let last=performance.now(), average=16.67, pressure=0, headroom=0, audioTime=0;
const origin=last;
function draw(now) {
  requestAnimationFrame(draw);
  const elapsed=clamp((now-last)/1000,0,.1), realTime=(now-origin)/1000;
  last=now;
  if(document.hidden) return;
  // Keep menu hit targets stationary while the pilot is choosing a plane.
  if(ready && flying && !paused) {
    average=mix(average,elapsed*1000,.045);
    pressure=average>20?pressure+elapsed:0;
    headroom=average<17.6?headroom+elapsed:0;
    if(pressure>1.25&&quality<3 || headroom>8&&quality>0) {
      quality+=pressure>1.25?1:-1;
      pressure=headroom=0;resizePending=true;
    }
  }
  if(resizePending) resize();
  ctx.clearRect(0,0,width,height);
  hitBoxes={};
  if(!renderWorld) rect(0,0,width,height,colors.violet);
  if(!flying) {
    if(entryScreen==='hangar') {hangarScreen(realTime);return;}
    if(renderWorld) renderWorld(titleCamera(realTime),realTime,null);
    if(entryScreen==='briefing') campaignBriefing();
    else if(entryScreen==='missions') missionSelectionScreen();
    else if(entryScreen==='controls') controlsScreen();
    else if(entryScreen==='lan') drawLanRoom();
    else titleScreen();
    return;
  }
  if(!paused && !lanMatch?.disconnected && !(lanMatch?.result && lanMatch.role==='host')) {
    accumulator+=elapsed;
    while(accumulator>=step) {
      if(lanMatch?.role==='guest') stepLanGuest(step); else simulate(step);
      simulationTime+=step;accumulator-=step;
    }
  }
  const alpha=accumulator/step;
  const s={...aircraft,position:blend(previous.position,aircraft.position,alpha),
    attitude:blendAttitude(previous.attitude,aircraft.attitude,alpha),
    velocity:blend(previous.velocity,aircraft.velocity,alpha),speed:mix(previous.speed,aircraft.speed,alpha)};
  s.bank=bankOf(basisOf(s.attitude));
  const cam=flightCamera(s,elapsed);
  renderWorld(cam,simulationTime,s);
  const canopyCoverage=viewBlend<.24?16:viewBlend<.48?11:viewBlend<.76?5:0;
  renderJet(cam,s,simulationTime,viewBlend>.35?clamp((viewBlend-.35)*2.6,0,1):0);
  renderWingman(cam,simulationTime,alpha);
  if(lanMatch) renderLanJet(cam);
  drawAirframeSmoke(s,cam);
  drawSpray(cam);
  drawMissionWorld(cam,lanMatch?lanEffectsForView():undefined);
  drawWingmanMarker(cam,alpha);
  drawWeather(simulationTime);
  drawCanopy(canopyCoverage);
  if(canopyCoverage<16) edgeVignette();
  flightHud(s,cam,simulationTime);
  missionHud(s,cam);
  if(lanMatch) drawLanHud(s,cam); else campaignHud(s);
  missionNotice(s);
  aircraftStatusHud();
  environmentHud();
  drawWingmanHud();
  drawWeaponFeedback(s,cam);
  drawDamageCue();
  if(!lanMatch) tutorialHud(s);
  if(touch) touchHud(s);
  const pauseWidth=touch?30:43;
  canvasButton('pause',lanMatch?'菜单':paused?'继续':'暂停',width-screenInsets[1]-pauseWidth-10,screenInsets[0]+8,pauseWidth,18,false,10);
  if(lanMatch) drawLanOverlay();
  else if(paused) {
    const center=width/2, y=height/2-66;
    rect(center-78,y,156,132,colors.ink);
    corners(center-78,y,155,131,8,dim);
    type('暂停',center,y+18,14,hud,'display','center');
    const kit=selectedLoadout();
    type(selectedModel().name+' · '+missionInfo().name,center,y+31,9,dim,'mono','center');
    type('机炮 '+kit.cannon+' 点 · 锁定 '+kit.lockTime.toFixed(2)+' 秒',center,y+44,9,dim,'mono','center');
    canvasButton('continueFlight','继续飞行',center-60,y+53,120,20,true,11);
    canvasButton('restartMission','重开本关',center-60,y+77,120,20,false,11);
    canvasButton('returnToTitle','保存并返回标题',center-60,y+101,120,20,false,10);
  }
  if(realTime-audioTime>.038) {sound(s);audioTime=realTime;}
}
const paintFrame=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
async function boot() {
  requestAnimationFrame(draw);
  if(!gl) {failure='此浏览器无法开启三维画面';return;}
  world.addEventListener('webglcontextlost',event=>{
    event.preventDefault();
    failure='图形连接已中断，请刷新页面';
    ready=flying=false;renderWorld=null;paused=true;
    closeLanRoom();lanMatch=null;
    entryScreen='title';
    if(aircraft) sound(aircraft);
  });
  const building=buildTerrain();
  building.catch(()=>{});
  try {
    await paintFrame();
    const graphics=setupGraphics();
    await building;
    progress=.81;loading='正在编译着色器…';
    graphics.upload();
    await paintFrame();
    graphics.compileJet();
    await paintFrame();
    progress=.94;loading='正在预热驾驶舱…';
    const warm=spawn();
    const warmCamera=titleCamera(0);
    renderWorld(warmCamera,0,warm);
    renderJet(warmCamera,warm,0,1);
    await paintFrame();
    progress=1;ready=true;
  } catch(error) {
    console.error(error);
    failure='湖区加载失败，请刷新页面';
  }
}
document.fonts.ready.then(()=>glyphs.clear());
document.fonts.addEventListener('loadingdone',()=>glyphs.clear());
boot();
</script>
